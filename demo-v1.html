<!-- Leaflet 1.x, script tags, with the published plugin build -->

<link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@joergdietrich/leaflet.terminator/L.Terminator.js"></script>
<style>
	#map {
		position: absolute;
		height: 100vh;
		width: 100vw;
		top: 0;
		left: 0;
	}
</style>
<div id="map"></div>

<script>
	// var map = L.map('map', { minZoom: 2, maxBounds: [[-85, -350], [85, 350]] }) // to avoid seeing terminator's end
	var map = L.map('map')
		.addLayer(L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 19,
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
		}))
		.setView([0, 0], 1.5);
	L.terminator().addTo(map);
</script>
