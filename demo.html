<!-- Leaflet 2, ES modules; serve over HTTP (e.g. `npx serve`), since browsers block modules from file:// -->

<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.css">
<script type="importmap">
	{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.5/dist/leaflet.js"}}
</script>
<style>
	#map {
		position: absolute;
		height: 100vh;
		width: 100vw;
		top: 0;
		left: 0;
	}
</style>
<div id="map"></div>

<script type="module">
	import {LeafletMap, TileLayer} from 'leaflet';
	import {Terminator} from './index.js';

	// const map = new LeafletMap('map', {minZoom: 2, maxBounds: [[-85, -350], [85, 350]]}) // to avoid seeing terminator's end
	const map = new LeafletMap('map').setView([0, 0], 1.5);
	new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);
	new Terminator().addTo(map);
</script>
